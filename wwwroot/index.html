<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Teste do Backend</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- PAINEL 1: CADASTRO DE PRODUTOS E ESTOQUE -->
        <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h1 class="text-lg font-bold text-gray-800">📦 Gestão de Produtos</h1>

            <!-- Formulário de Novo Produto -->
            <div class="space-y-2 bg-gray-50 p-3 rounded border">
                <h2 class="text-xs font-bold text-gray-600 uppercase">Cadastrar Novo Produto</h2>
                <input type="text" id="novoProdId" placeholder="ID (ex: POCO_X7)" class="w-full p-2 border rounded text-xs">
                <input type="text" id="novoProdNome" placeholder="Nome do Produto" class="w-full p-2 border rounded text-xs">
                <input type="number" id="novoProdPreco" placeholder="Preço (R$)" step="0.01" class="w-full p-2 border rounded text-xs">
                <button onclick="cadastrarProduto()" class="w-full bg-emerald-600 text-white text-xs font-bold py-2 rounded hover:bg-emerald-700 transition">
                    + Cadastrar Produto
                </button>
            </div>

            <!-- Lista de Estoque -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">Estoque Disponível</h3>
                    <button onclick="carregarEstoque()" class="text-xs text-blue-600 underline">Atualizar</button>
                </div>
                <ul id="listaEstoque" class="text-xs space-y-1 max-h-48 overflow-y-auto bg-gray-50 p-2 rounded border">
                    <li class="text-gray-400 italic">Carregando estoque...</li>
                </ul>
            </div>
        </div>

        <!-- PAINEL 2: CARRINHO E FECHAMENTO DE PEDIDO -->
        <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h1 class="text-lg font-bold text-gray-800">🛒 Carrinho & Pedido</h1>

            <!-- Seleção e Adição de Item -->
            <div class="space-y-2 bg-gray-50 p-3 rounded border">
                <h2 class="text-xs font-bold text-gray-600 uppercase">Adicionar Item ao Carrinho</h2>

                <div>
                    <label class="block text-[10px] text-gray-500">Selecione o Produto:</label>
                    <select id="selectProduto" onchange="selecionarProduto()" class="w-full p-2 border rounded text-xs bg-white">
                        <option value="">-- Escolha um Produto --</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-500">Quantidade:</label>
                        <input type="number" id="qtd" value="1" min="1" class="w-full p-2 border rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500">Preço Unitário:</label>
                        <input type="number" id="preco" readonly class="w-full p-2 border rounded text-xs bg-gray-100 cursor-not-allowed">
                    </div>
                </div>

                <button onclick="adicionarItem()" class="w-full bg-gray-800 text-white text-xs font-bold py-2 rounded hover:bg-black transition">
                    + Adicionar ao Carrinho
                </button>
            </div>

            <!-- Fechamento do Pedido -->
            <div class="space-y-2">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Nome do Cliente</label>
                    <input type="text" id="clienteNome" placeholder="Digite o nome do cliente..." class="w-full p-2 border rounded text-sm">
                </div>

                <button onclick="enviarParaAPI()" class="w-full bg-blue-600 text-white font-bold py-2 rounded shadow hover:bg-blue-700 transition">
                    🚀 Fechar Pedido
                </button>
            </div>
        </div>

        <!-- PAINEL 3: RESPOSTA DA API -->
        <div class="bg-gray-900 p-6 rounded-xl shadow-md text-white flex flex-col h-full min-h-[400px]">
            <h2 class="text-lg font-bold mb-2 flex justify-between items-center">
                <span>Retorno da API</span>
                <span id="statusBadge" class="text-xs px-2 py-1 rounded bg-gray-700">Aguardando...</span>
            </h2>
            <pre id="jsonOutput" class="text-green-400 text-xs font-mono flex-1 overflow-auto bg-black p-4 rounded border border-gray-800">Aguardando ações...</pre>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Altere para a porta exata onde sua API C# está rodando
        const BASE_URL = "http://localhost:5267";

        let estoqueLocal = [];

        // Executa ao carregar a página
        window.onload = () => {
            carregarEstoque();
        };

        // Exibe respostas no painel escuro
        function exibirResposta(status, dados) {
            const statusBadge = document.getElementById('statusBadge');
            const jsonOutput = document.getElementById('jsonOutput');

            statusBadge.innerText = `Status: ${status}`;
            statusBadge.className = status >= 200 && status < 300
                ? "text-xs px-2 py-1 rounded bg-green-700"
                : "text-xs px-2 py-1 rounded bg-red-700";

            jsonOutput.innerText = typeof dados === "string" ? dados : JSON.stringify(dados, null, 2);
        }

        // ==========================================
        // 1. GESTÃO DE PRODUTOS
        // ==========================================
        async function carregarEstoque() {
            try {
                const response = await fetch(`${BASE_URL}/api/produtos`);
                if (!response.ok) throw new Error(`Erro: ${response.status}`);

                estoqueLocal = await response.json();

                // Atualiza a lista visual
                const listaEstoque = document.getElementById('listaEstoque');
                listaEstoque.innerHTML = "";

                // Atualiza o <select> do carrinho
                const selectProduto = document.getElementById('selectProduto');
                selectProduto.innerHTML = '<option value="">-- Escolha um Produto --</option>';

                if (estoqueLocal.length === 0) {
                    listaEstoque.innerHTML = '<li class="text-gray-400 italic">Nenhum produto cadastrado.</li>';
                    return;
                }

                estoqueLocal.forEach(p => {
                    // Preenche lista de estoque
                    const li = document.createElement('li');
                    li.className = "flex justify-between border-b pb-1";
                    li.innerHTML = `<span><strong>${p.id}</strong> - ${p.nome}</span> <span class="text-emerald-600 font-bold">R$ ${p.price}</span>`;
                    listaEstoque.appendChild(li);

                    // Preenche select
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.innerText = `${p.nome} (R$ ${p.price})`;
                    selectProduto.appendChild(option);
                });

                exibirResposta(response.status, estoqueLocal);
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Não foi possível conectar à API ao carregar produtos.");
            }
        }

        async function cadastrarProduto() {
            const id = document.getElementById('novoProdId').value;
            const nome = document.getElementById('novoProdNome').value;
            const price = parseFloat(document.getElementById('novoProdPreco').value);

            if (!id || !nome || isNaN(price)) {
                alert("Preencha todos os campos do produto!");
                return;
            }

            const novoProduto = { id, nome, price };

            try {
                const response = await fetch(`${BASE_URL}/api/produtos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(novoProduto)
                });

                const resultado = await response.text();
                exibirResposta(response.status, resultado ? JSON.parse(resultado) : "Produto cadastrado!");

                if (response.ok) {
                    document.getElementById('novoProdId').value = "";
                    document.getElementById('novoProdNome').value = "";
                    document.getElementById('novoProdPreco').value = "";
                    carregarEstoque();
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Falha na conexão ao cadastrar produto.");
            }
        }

        function selecionarProduto() {
            const prodId = document.getElementById('selectProduto').value;
            const produto = estoqueLocal.find(p => p.id === prodId);

            if (produto) {
                document.getElementById('preco').value = produto.price;
            } else {
                document.getElementById('preco').value = "";
            }
        }

        // ==========================================
        // 2. CARRINHO E ITEM
        // ==========================================
        async function adicionarItem() {
            const prodId = document.getElementById('selectProduto').value;
            const qtd = parseInt(document.getElementById('qtd').value) || 1;

            if (!prodId) {
                alert("Selecione um produto do estoque!");
                return;
            }

            const itemPayload = {
                Id: `item_${Date.now()}`,
                IdProduto: prodId,
                Quantidade: qtd
            };

            try {
                const response = await fetch(`${BASE_URL}/api/item`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(itemPayload)
                });

                const dados = await response.json();
                exibirResposta(response.status, dados);

                if (response.ok) {
                    alert("Item adicionado ao carrinho!");
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Erro de conexão ao adicionar item.");
            }
        }

        // ==========================================
        // 3. FECHAR PEDIDO
        // ==========================================
        async function enviarParaAPI() {
            const cliente = document.getElementById('clienteNome').value;

            if (!cliente) {
                alert("Informe o nome do cliente para fechar o pedido!");
                return;
            }

            const pedidoPayload = {
                Id: `pedido_${Date.now()}`,
                Cliente: cliente
            };

            try {
                const response = await fetch(`${BASE_URL}/api/pedido`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(pedidoPayload)
                });

                const dados = await response.json();
                exibirResposta(response.status, dados);

                if (response.ok) {
                    alert("Pedido fechado com sucesso!");
                    document.getElementById('clienteNome').value = "";
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Erro de conexão ao fechar pedido.");
            }
        }
    </script>
</body>
</html>
