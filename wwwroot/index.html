<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce - Teste do Backend</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">

    <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- PAINEL 1: GESTÃO DE PRODUTOS -->
        <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h1 class="text-lg font-bold text-gray-800 flex justify-between items-center">
                <span>📦 Gestão de Produtos</span>
                <button onclick="carregarEstoque()" class="text-xs text-blue-600 underline font-normal">Atualizar Lista</button>
            </h1>

            <!-- Formulário de Cadastro / Edição -->
            <div class="space-y-2 bg-gray-50 p-3 rounded border">
                <h2 id="tituloFormProd" class="text-xs font-bold text-gray-600 uppercase">Cadastrar Novo Produto</h2>
                <input type="text" id="prodId" placeholder="ID (ex: POCO_X8)" class="w-full p-2 border rounded text-xs">
                <input type="text" id="prodNome" placeholder="Nome do Produto" class="w-full p-2 border rounded text-xs">
                <input type="number" id="prodPreco" placeholder="Preço (R$)" step="0.01" class="w-full p-2 border rounded text-xs">

                <div class="flex gap-2">
                    <button id="btnSalvarProd" onclick="salvarProduto()" class="flex-1 bg-emerald-600 text-white text-xs font-bold py-2 rounded hover:bg-emerald-700 transition">
                        + Cadastrar Produto
                    </button>
                    <button id="btnCancelarEdit" onclick="limparFormProduto()" class="hidden bg-gray-400 text-white text-xs font-bold px-3 py-2 rounded hover:bg-gray-500 transition">
                        Cancelar
                    </button>
                </div>
            </div>

            <!-- Lista de Estoque com Ações -->
            <div>
                <h3 class="text-xs font-bold text-gray-500 uppercase mb-2">Estoque Disponível</h3>
                <ul id="listaEstoque" class="text-xs space-y-2 max-h-60 overflow-y-auto bg-gray-50 p-2 rounded border">
                    <li class="text-gray-400 italic">Carregando estoque...</li>
                </ul>
            </div>
        </div>

        <!-- PAINEL 2: CARRINHO E FECHAMENTO DE PEDIDO -->
        <div class="bg-white p-6 rounded-xl shadow-md space-y-4">
            <h1 class="text-lg font-bold text-gray-800">🛒 Carrinho & Pedido</h1>

            <!-- Seleção e Adição de Item -->
            <div class="space-y-2 bg-gray-50 p-3 rounded border">
                <h2 class="text-xs font-bold text-gray-600 uppercase">Adicionar Item ao Carrinho</h2>

                <div>
                    <label class="block text-[10px] text-gray-500">Selecione o Produto:</label>
                    <select id="selectProduto" onchange="selecionarProduto()" class="w-full p-2 border rounded text-xs bg-white">
                        <option value="">-- Escolha um Produto --</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-gray-500">Quantidade:</label>
                        <input type="number" id="qtd" value="1" min="1" class="w-full p-2 border rounded text-xs">
                    </div>
                    <div>
                        <label class="block text-[10px] text-gray-500">Preço Unitário (R$):</label>
                        <input type="number" id="preco" readonly class="w-full p-2 border rounded text-xs bg-gray-100 cursor-not-allowed">
                    </div>
                </div>

                <button onclick="adicionarItem()" class="w-full bg-gray-800 text-white text-xs font-bold py-2 rounded hover:bg-black transition">
                    + Adicionar ao Carrinho
                </button>
            </div>

            <!-- Itens Atuais no Carrinho com Opção de Excluir -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">Itens do Carrinho / Pedido</h3>
                    <button onclick="carregarItensCarrinho()" class="text-xs text-blue-600 underline">Atualizar Carrinho</button>
                </div>
                <ul id="listaCarrinho" class="text-xs space-y-2 max-h-40 overflow-y-auto bg-gray-50 p-2 rounded border">
                    <li class="text-gray-400 italic">Carregando itens...</li>
                </ul>
            </div>

            <!-- Fechamento do Pedido -->
            <div class="space-y-2 pt-2 border-t">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase">Nome do Cliente</label>
                    <input type="text" id="clienteNome" placeholder="Digite o nome do cliente..." class="w-full p-2 border rounded text-sm">
                </div>

                <button onclick="enviarParaAPI()" class="w-full bg-blue-600 text-white font-bold py-2 rounded shadow hover:bg-blue-700 transition">
                    🚀 Fechar Pedido
                </button>
            </div>
        </div>

        <!-- PAINEL 3: RESPOSTA DA API -->
        <div class="bg-gray-900 p-6 rounded-xl shadow-md text-white flex flex-col h-full min-h-[450px]">
            <h2 class="text-lg font-bold mb-2 flex justify-between items-center">
                <span>Retorno da API</span>
                <span id="statusBadge" class="text-xs px-2 py-1 rounded bg-gray-700">Aguardando...</span>
            </h2>
            <pre id="jsonOutput" class="text-green-400 text-xs font-mono flex-1 overflow-auto bg-black p-4 rounded border border-gray-800">Aguardando ações...</pre>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        const BASE_URL = "https://localhost:7024";

        let estoqueLocal = [];
        let editando = false;

        window.onload = () => {
            carregarEstoque();
            carregarItensCarrinho();
        };

        function exibirResposta(status, dados) {
            const statusBadge = document.getElementById('statusBadge');
            const jsonOutput = document.getElementById('jsonOutput');

            statusBadge.innerText = `Status: ${status}`;
            statusBadge.className = status >= 200 && status < 300
                ? "text-xs px-2 py-1 rounded bg-green-700"
                : "text-xs px-2 py-1 rounded bg-red-700";

            jsonOutput.innerText = typeof dados === "string" ? dados : JSON.stringify(dados, null, 2);
        }

        // ==========================================
        // 1. PRODUTOS (Listar, Cadastrar, Editar, Excluir)
        // ==========================================
        async function carregarEstoque() {
            try {
                const response = await fetch(`${BASE_URL}/api/produtos`);
                if (!response.ok) throw new Error(`Erro: ${response.status}`);

                estoqueLocal = await response.json();

                const listaEstoque = document.getElementById('listaEstoque');
                listaEstoque.innerHTML = "";

                const selectProduto = document.getElementById('selectProduto');
                selectProduto.innerHTML = '<option value="">-- Escolha um Produto --</option>';

                if (estoqueLocal.length === 0) {
                    listaEstoque.innerHTML = '<li class="text-gray-400 italic">Nenhum produto cadastrado.</li>';
                    return;
                }

                estoqueLocal.forEach(p => {
                    // Preenche lista de estoque com botões de Editar e Excluir
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center border-b pb-1 gap-2";
                    li.innerHTML = `
                            <div class="truncate">
                                <strong>${p.id}</strong> - ${p.nome}
                                <span class="text-emerald-600 font-bold ml-1">R$ ${p.price}</span>
                            </div>
                            <div class="flex gap-1 shrink-0">
                                <button onclick="prepararEdicao('${p.id}', '${p.nome}', ${p.price})" class="bg-amber-500 text-white px-2 py-0.5 rounded text-[10px] hover:bg-amber-600">Editar</button>
                                <button onclick="deletarProduto('${p.id}')" class="bg-red-500 text-white px-2 py-0.5 rounded text-[10px] hover:bg-red-600">Excluir</button>
                            </div>
                        `;
                    listaEstoque.appendChild(li);

                    // Preenche select
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.innerText = `${p.nome} (R$ ${p.price})`;
                    selectProduto.appendChild(option);
                });

                exibirResposta(response.status, estoqueLocal);
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Não foi possível conectar à API ao carregar produtos.");
            }
        }

        async function salvarProduto() {
            const id = document.getElementById('prodId').value;
            const nome = document.getElementById('prodNome').value;
            const price = parseFloat(document.getElementById('prodPreco').value);

            if (!id || !nome || isNaN(price)) {
                alert("Preencha todos os campos do produto!");
                return;
            }

            const produtoPayload = { id, nome, price };
            const endpoint = editando ? `${BASE_URL}/api/produtos/${id}` : `${BASE_URL}/api/produtos`;
            const metodo = editando ? "PUT" : "POST";

            try {
                const response = await fetch(endpoint, {
                    method: metodo,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(produtoPayload)
                });

                const texto = await response.text();
                exibirResposta(response.status, texto ? (texto.startsWith("{") ? JSON.parse(texto) : texto) : "Sucesso!");

                if (response.ok) {
                    limparFormProduto();
                    carregarEstoque();
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Falha na conexão ao salvar produto.");
            }
        }

        function prepararEdicao(id, nome, price) {
            editando = true;
            document.getElementById('prodId').value = id;
            document.getElementById('prodId').readOnly = true; // Não altera o ID no PUT
            document.getElementById('prodId').classList.add('bg-gray-100');
            document.getElementById('prodNome').value = nome;
            document.getElementById('prodPreco').value = price;

            document.getElementById('tituloFormProd').innerText = "Editar Produto";
            document.getElementById('btnSalvarProd').innerText = "Atualizar Produto";
            document.getElementById('btnSalvarProd').className = "flex-1 bg-amber-600 text-white text-xs font-bold py-2 rounded hover:bg-amber-700 transition";
            document.getElementById('btnCancelarEdit').classList.remove('hidden');
        }

        function limparFormProduto() {
            editando = false;
            document.getElementById('prodId').value = "";
            document.getElementById('prodId').readOnly = false;
            document.getElementById('prodId').classList.remove('bg-gray-100');
            document.getElementById('prodNome').value = "";
            document.getElementById('prodPreco').value = "";

            document.getElementById('tituloFormProd').innerText = "Cadastrar Novo Produto";
            document.getElementById('btnSalvarProd').innerText = "+ Cadastrar Produto";
            document.getElementById('btnSalvarProd').className = "flex-1 bg-emerald-600 text-white text-xs font-bold py-2 rounded hover:bg-emerald-700 transition";
            document.getElementById('btnCancelarEdit').classList.add('hidden');
        }

        async function deletarProduto(id) {
            if (!confirm(`Tem certeza que deseja excluir o produto "${id}"?`)) return;

            try {
                const response = await fetch(`${BASE_URL}/api/produtos/${id}`, {
                    method: "DELETE"
                });

                const texto = await response.text();
                exibirResposta(response.status, texto);

                if (response.ok) {
                    carregarEstoque();
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Erro de conexão ao deletar produto.");
            }
        }

        function selecionarProduto() {
            const prodId = document.getElementById('selectProduto').value;
            const produto = estoqueLocal.find(p => p.id === prodId);

            if (produto) {
                document.getElementById('preco').value = produto.price;
            } else {
                document.getElementById('preco').value = "";
            }
        }

        // ==========================================
        // 2. CARRINHO & ITENS (Listar, Adicionar, Excluir)
        // ==========================================
        async function carregarItensCarrinho() {
            try {
                const response = await fetch(`${BASE_URL}/api/pedido`);
                if (!response.ok) throw new Error(`Erro: ${response.status}`);

                const itens = await response.json();
                const listaCarrinho = document.getElementById('listaCarrinho');
                listaCarrinho.innerHTML = "";

                if (!itens || itens.length === 0) {
                    listaCarrinho.innerHTML = '<li class="text-gray-400 italic">O carrinho está vazio.</li>';
                    return;
                }

                itens.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center border-b pb-1 gap-2";
                    li.innerHTML = `
                            <div class="truncate">
                                <strong>Prod: ${item.idProduto}</strong> (Qtd: ${item.quantidade})
                                <span class="text-gray-600 font-bold ml-1">R$ ${item.valorTotal || item.precoUnitario * item.quantidade}</span>
                                ${item.pedidoId ? `<span class="text-[9px] bg-gray-200 px-1 rounded block">Pedido: ${item.pedidoId}</span>` : '<span class="text-[9px] bg-amber-100 text-amber-800 px-1 rounded block">No Carrinho</span>'}
                            </div>
                            <button onclick="deletarItemCarrinho('${item.idProduto}')" class="bg-red-500 text-white px-2 py-0.5 rounded text-[10px] hover:bg-red-600 shrink-0">
                                Remover
                            </button>
                        `;
                    listaCarrinho.appendChild(li);
                });

            } catch (erro) {
                console.error(erro);
                document.getElementById('listaCarrinho').innerHTML = '<li class="text-red-400 italic">Erro ao carregar carrinho.</li>';
            }
        }

        async function adicionarItem() {
            const prodId = document.getElementById('selectProduto').value;
            const qtd = parseInt(document.getElementById('qtd').value) || 1;

            if (!prodId) {
                alert("Selecione um produto do estoque!");
                return;
            }

            const itemPayload = {
                Id: `item_${Date.now()}`,
                IdProduto: prodId,
                Quantidade: qtd
            };

            try {
                const response = await fetch(`${BASE_URL}/api/item`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(itemPayload)
                });

                const dados = await response.json();
                exibirResposta(response.status, dados);

                if (response.ok) {
                    carregarItensCarrinho();
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Erro de conexão ao adicionar item.");
            }
        }

        async function deletarItemCarrinho(idProduto) {
            if (!confirm(`Deseja remover os itens do produto "${idProduto}" do carrinho?`)) return;

            try {
                const response = await fetch(`${BASE_URL}/api/pedido/${idProduto}`, {
                    method: "DELETE"
                });

                exibirResposta(response.status, "Item removido do carrinho com sucesso.");

                if (response.ok) {
                    carregarItensCarrinho();
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Erro ao remover item do carrinho.");
            }
        }

        // ==========================================
        // 3. FECHAR PEDIDO
        // ==========================================
        async function enviarParaAPI() {
            const cliente = document.getElementById('clienteNome').value;

            if (!cliente) {
                alert("Informe o nome do cliente para fechar o pedido!");
                return;
            }

            const pedidoPayload = {
                Id: `pedido_${Date.now()}`,
                Cliente: cliente
            };

            try {
                const response = await fetch(`${BASE_URL}/api/pedido`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(pedidoPayload)
                });

                const dados = await response.json();
                exibirResposta(response.status, dados);

                if (response.ok) {
                    alert("Pedido fechado com sucesso!");
                    document.getElementById('clienteNome').value = "";
                    carregarItensCarrinho();
                }
            } catch (erro) {
                console.error(erro);
                exibirResposta("ERRO", "Erro de conexão ao fechar pedido.");
            }
        }
    </script>
</body>
</html>
